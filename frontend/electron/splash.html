<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SentinelTex</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(214,178,94,.12), transparent 55%), #11160f;
         color: #ebe8d8; font-family: Bahnschrift, "Segoe UI", sans-serif; user-select: none; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  svg { filter: drop-shadow(0 0 10px rgba(214,178,94,.55)); }
  svg * { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.3s ease forwards; }
  svg .late { animation-delay: .5s; }
  .word { font-size: 40px; font-weight: 700; letter-spacing: 7px; opacity: 0; animation: rise .6s .6s ease forwards; }
  .word b { color: #d6b25e; }
  .sub { color: #a6ac94; font-family: "Segoe UI", sans-serif; font-size: 14px; opacity: 0; animation: rise .6s .8s ease forwards; }
  .bar { width: 260px; height: 2px; background: #34412e; overflow: hidden; position: relative; }
  .bar i { position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: #d6b25e; box-shadow: 0 0 10px #d6b25e; animation: sweep 1.4s ease-in-out infinite; }
  .step { font-family: Consolas, monospace; font-size: 12px; color: #7d8670; min-height: 16px; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes sweep { to { left: 100%; } }
</style></head>
<body><div class="box">
  <svg width="104" height="104" viewBox="0 0 48 48" fill="none" stroke="#d6b25e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 4l16 6v12c0 10-7 17-16 21C15 39 8 32 8 22V10z"/>
    <circle class="late" cx="24" cy="23" r="7"/><line class="late" x1="24" y1="11" x2="24" y2="16"/><line class="late" x1="24" y1="30" x2="24" y2="35"/>
    <line class="late" x1="12" y1="23" x2="17" y2="23"/><line class="late" x1="31" y1="23" x2="36" y2="23"/>
  </svg>
  <div class="word">SENTINEL<b>TEX</b></div>
  <div class="sub">Military uniform fabric quality assurance</div>
  <div class="bar"><i></i></div>
  <div class="step" id="step">Starting the local analysis services</div>
</div>
<script>
  // Messages only; the real start up is done by main.cjs, which replaces this page when the backend answers.
  const steps = ['Starting the local analysis services', 'Loading the image model and OCR', 'Opening the specification knowledge base', 'Almost ready (the first start can take a minute)'];
  let i = 0; setInterval(() => { i = Math.min(i + 1, steps.length - 1); document.getElementById('step').textContent = steps[i]; }, 3500);
</script>
</body></html>
