<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6656"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0403c"/></marker></defs><rect width="1200" height="550" fill="#ffffff"/><text x="32" y="44" font-size="24" font-weight="700" fill="#1f2a1f">From inputs to a Quality Assessment Report</text><rect x="30" y="110" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfc0" stroke-width="1.5"/><text x="115.0" y="134.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Fabric photo</text><text x="115.0" y="153.0" text-anchor="middle" font-size="12.5" fill="#5d6656">JPG / PNG</text><rect x="30" y="290" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfc0" stroke-width="1.5"/><text x="115.0" y="305.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Lab report scan</text><text x="115.0" y="324.0" text-anchor="middle" font-size="12.5" fill="#5d6656">scan, photocopy</text><text x="115.0" y="341.0" text-anchor="middle" font-size="12.5" fill="#5d6656">or phone photo</text><rect x="250" y="110" width="190" height="70" rx="10" fill="#f4f5ef" stroke="#c9cfc0" stroke-width="1.5"/><text x="345.0" y="134.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Image Analysis</text><text x="345.0" y="153.0" text-anchor="middle" font-size="12.5" fill="#5d6656">YOLOv8, cutoff 5%</text><rect x="250" y="270" width="190" height="110" rx="10" fill="#f4f5ef" stroke="#c9cfc0" stroke-width="1.5"/><text x="345.0" y="287.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Test Analysis</text><text x="345.0" y="306.0" text-anchor="middle" font-size="12.5" fill="#5d6656">find page · straighten</text><text x="345.0" y="323.0" text-anchor="middle" font-size="12.5" fill="#5d6656">remove specks and lines</text><text x="345.0" y="340.0" text-anchor="middle" font-size="12.5" fill="#5d6656">Tesseract · match rows</text><text x="345.0" y="357.0" text-anchor="middle" font-size="12.5" fill="#5d6656">to clauses · check units</text><path d="M200,145 L250,145" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M200,325 L250,325" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="490" y="110" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfc0" stroke-width="1.5"/><text x="575.0" y="134.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Defect counts</text><text x="575.0" y="153.0" text-anchor="middle" font-size="12.5" fill="#5d6656">per type, with boxes</text><rect x="490" y="290" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfc0" stroke-width="1.5"/><text x="575.0" y="314.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Clause values</text><text x="575.0" y="333.0" text-anchor="middle" font-size="12.5" fill="#5d6656">18 test results</text><path d="M440,145 L490,145" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M440,325 L490,325" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="710" y="190" width="200" height="100" rx="10" fill="#55613b" stroke="#55613b" stroke-width="1.5"/><text x="810.0" y="220.0" text-anchor="middle" font-size="15" font-weight="650" fill="#ffffff">Compliance checker</text><text x="810.0" y="239.0" text-anchor="middle" font-size="12.5" fill="#ffffff">every value against</text><text x="810.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#ffffff">its clause (STS/UC/01)</text><path d="M660,145 C690,145 690,215 710,215" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M660,325 C690,325 690,265 710,265" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="714" y="306" width="96" height="22" rx="11" fill="none" stroke="#2f8f5b"/><text x="761" y="321" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2f8f5b">PASS</text><rect x="812" y="306" width="96" height="22" rx="11" fill="none" stroke="#c0403c"/><text x="859" y="321" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0403c">FAIL</text><rect x="714" y="334" width="96" height="22" rx="11" fill="none" stroke="#c8891f"/><text x="761" y="349" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c8891f">CHECK MANUALLY</text><rect x="812" y="334" width="96" height="22" rx="11" fill="none" stroke="#5d6656"/><text x="859" y="349" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5d6656">NOT REPORTED</text><rect x="960" y="110" width="210" height="90" rx="10" fill="#ffffff" stroke="#55613b" stroke-width="1.5"/><text x="1065.0" y="135.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Decision</text><text x="1065.0" y="154.0" text-anchor="middle" font-size="12.5" fill="#5d6656">ACCEPT · REJECT ·</text><text x="1065.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#5d6656">NOT VERIFIABLE</text><rect x="960" y="260" width="210" height="110" rx="10" fill="#ffffff" stroke="#c9cfc0" stroke-width="1.5"/><text x="1065.0" y="286.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Explanation</text><text x="1065.0" y="305.0" text-anchor="middle" font-size="12.5" fill="#5d6656">clauses from ChromaDB</text><text x="1065.0" y="322.0" text-anchor="middle" font-size="12.5" fill="#5d6656">written by the local LLM</text><text x="1065.0" y="339.0" text-anchor="middle" font-size="12.5" fill="#5d6656">grounding check</text><path d="M910,215 C935,215 935,155 960,155" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M910,265 C935,265 935,315 960,315" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="560" y="440" width="380" height="74" rx="10" fill="#55613b" stroke="#55613b" stroke-width="1.5"/><text x="750.0" y="466.0" text-anchor="middle" font-size="15" font-weight="650" fill="#ffffff">Quality Assessment Report</text><text x="750.0" y="485.0" text-anchor="middle" font-size="12.5" fill="#ffffff">goes to the Assistant Manager, then the Deputy Manager</text><path d="M1065,200 L1065,240 L1180,240 L1180,477 L940,477" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M1065,370 L1065,410 L750,410 L750,440" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="30" y="440" font-size="12.5" fill="#5d6656">A defect seen only by the image model is</text><text x="30" y="458" font-size="12.5" fill="#5d6656">CHECK MANUALLY: a person confirms it.</text><text x="30" y="490" font-size="12.5" fill="#5d6656">Unclear values are flagged, never guessed.</text></svg>