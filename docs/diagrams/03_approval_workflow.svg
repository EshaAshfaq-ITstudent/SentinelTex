<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6656"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0403c"/></marker></defs><rect width="1080" height="510" fill="#ffffff"/><text x="32" y="44" font-size="24" font-weight="700" fill="#1f2a1f">Dual approval: Assistant Manager then Deputy Manager</text><rect x="40" y="150" width="190" height="80" rx="10" fill="#ffffff" stroke="#c9cfc0" stroke-width="1.5"/><text x="135.0" y="179.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Lab Analyst</text><text x="135.0" y="198.0" text-anchor="middle" font-size="12.5" fill="#5d6656">uploads and runs analysis</text><rect x="300" y="150" width="200" height="80" rx="10" fill="#f4f5ef" stroke="#c9cfc0" stroke-width="1.5"/><text x="400.0" y="179.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Waiting for AM</text><text x="400.0" y="198.0" text-anchor="middle" font-size="12.5" fill="#5d6656">report version n</text><rect x="590" y="150" width="200" height="80" rx="10" fill="#f4f5ef" stroke="#c9cfc0" stroke-width="1.5"/><text x="690.0" y="179.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Waiting for DM</text><text x="690.0" y="198.0" text-anchor="middle" font-size="12.5" fill="#5d6656">AM approved</text><rect x="880" y="150" width="180" height="80" rx="10" fill="#2f8f5b" stroke="#2f8f5b" stroke-width="1.5"/><text x="970.0" y="179.0" text-anchor="middle" font-size="15" font-weight="650" fill="#ffffff">Approved</text><text x="970.0" y="198.0" text-anchor="middle" font-size="12.5" fill="#ffffff">final, both signed</text><path d="M230,190 L300,190" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="240" y="180" font-size="12" fill="#5d6656">analyse</text><path d="M500,190 L590,190" stroke="#2f8f5b" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="508" y="180" font-size="12" fill="#2f8f5b">AM approves</text><path d="M790,190 L880,190" stroke="#2f8f5b" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="797" y="180" font-size="12" fill="#2f8f5b">DM approves</text><rect x="430" y="330" width="240" height="80" rx="10" fill="#fdf1f0" stroke="#c0403c" stroke-width="1.5"/><text x="550.0" y="359.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2a1f">Returned for re-analysis</text><text x="550.0" y="378.0" text-anchor="middle" font-size="12.5" fill="#5d6656">rejection needs a comment</text><path d="M400,230 C400,290 470,300 500,330" stroke="#c0403c" stroke-width="1.8" fill="none" marker-end="url(#r)"/><text x="330" y="290" font-size="12" fill="#c0403c">AM rejects</text><path d="M690,230 C690,290 630,300 600,330" stroke="#c0403c" stroke-width="1.8" fill="none" marker-end="url(#r)"/><text x="700" y="290" font-size="12" fill="#c0403c">DM rejects</text><path d="M430,370 C220,370 135,330 135,230" stroke="#5d6656" stroke-width="1.8" fill="none" marker-end="url(#a)"/><text x="180" y="392" font-size="12" fill="#5d6656">analyst runs analysis again: version n + 1</text><text x="40" y="460" font-size="13" fill="#5d6656">Rules enforced by the backend: each reviewer can act only at their own stage (otherwise 409); the DM cannot act before the AM;</text><text x="40" y="480" font-size="13" fill="#5d6656">only managers review; every review is stored with role, comment and time and shown as a stamp on the report.</text></svg>